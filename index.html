<head></head>
<body>
    <h1>todo list</h1>
    <input id ="task" placeholder="type todo">
    <button onclick="addTodo()">add todo</button>
    <div id="todos"></div>
</body>
<script>
    let index = 1
    function addTodo(){
        const div = document.createElement("div");
        div.setAttribute("id","todo-"+index)
        //create todo
        const todo = index + '. ' + document.querySelector("#task").value
        const delbtn = document.createElement("button")
        delbtn.textContent = "Delete Todo"
        delbtn.setAttribute("onclick","deleteTodo("+index+")")
        //add content
        div.innerHTML = todo
        div.appendChild(delbtn)
        //add todo to todos
        const parent = document.querySelector("#todos")
        parent.appendChild(div)
        index++
    }

    function deleteTodo(x){
        //select todo
        const todos = document.querySelector("#todos")
        const todo = todos.querySelector("#todo-"+x)
        todos.removeChild(todo)
        
    }
</script>
