<head></head>
<body>
  <input type="text" />
  <button onclick="addTodo()">Add todo!</button>
  <div id="todolist"></div>
  <script>
    let todos = [];

    function addTodo() {
      todos.push({
        title: document.querySelector("input").value,
      });
      // console.log(document.querySelector("input").value);
      render();
    }

    function deleteTodo(x) {
      todos.splice(x, 1);
      render();
    }

    function render() {
      let page = document.querySelector("#todolist");
      page.innerHTML = "";
      // document.body.innerHTML = "";

      let listoftodos = document.createElement("div");
      for (let i = 0; i < todos.length; i++) {
        const todoObj = todos[i];
        const todo = document.createElement("div");
        todo.textContent = i + 1 + ". " + todoObj["title"];

        const delbtn = document.createElement("button");
        delbtn.setAttribute("onclick", "deleteTodo(" + i + ")");
        delbtn.textContent = "Delete Todo";

        todo.appendChild(delbtn);
        listoftodos.appendChild(todo);
      }
      page.appendChild(listoftodos);
    }
  </script>
</body>
